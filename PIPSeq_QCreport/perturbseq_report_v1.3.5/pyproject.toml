[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perturbseq-report"
version = "1.3.5"
description = "Perturb-seq QC and analysis pipeline producing a self-contained HTML report"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "anndata>=0.9",
    "scanpy>=1.9",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
full = ["leidenalg>=0.10", "igraph>=0.10", "harmonypy>=0.0.9", "scrublet>=0.2.3", "pyyaml>=6.0"]
dev = ["pytest>=7.4"]

[project.scripts]
perturbseq-report = "perturbseq_report.cli:main"

[tool.setuptools]
packages = ["perturbseq_report"]
